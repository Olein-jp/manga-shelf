name: Release plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be a semantic version such as 0.1.0."
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build plugin ZIP
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_dir="$RUNNER_TEMP/manga-shelf"
          package_file="$RUNNER_TEMP/manga-shelf-$TAG_NAME.zip"

          mkdir -p "$package_dir"
          rsync -a --exclude-from=.distignore ./ "$package_dir/"
          sed -i "s/^ \* Version: .*/ * Version:           $TAG_NAME/" "$package_dir/manga-shelf.php"
          sed -i "s/define( 'MANGA_SHELF_VERSION', '.*' );/define( 'MANGA_SHELF_VERSION', '$TAG_NAME' );/" "$package_dir/manga-shelf.php"

          cd "$RUNNER_TEMP"
          zip -rq "$package_file" manga-shelf
          unzip -p "$package_file" manga-shelf/manga-shelf.php | grep -F "Version:           $TAG_NAME"
          unzip -l "$package_file"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" "$RUNNER_TEMP/manga-shelf-$TAG_NAME.zip" --generate-notes --title "$TAG_NAME"
